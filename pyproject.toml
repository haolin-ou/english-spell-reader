[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "english-spell-reader-core"
version = "0.4.0"
description = "English spelling reader source with speech planning, saved rules and tested orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
speech = ["pyttsx3>=2.90", "piper-tts>=1.4.2", "edge-tts>=7.0.0"]
build = ["pyinstaller>=6.0"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
